# v249 : CORS sur les polices seulement (/cuisine/fonts/), pour l'éditeur admin (prod admin.jigme.fr et préprod admin).
# Toute autre origine : en-tête absent (valeur vide = non envoyé). Le reste du site n'a pas de CORS.
map $http_origin $rj_cors_polices {
  default "";
  "https://admin.jigme.fr" $http_origin;
  "https://preprod-admin-jigme.fly.dev" $http_origin;
}
server {
  listen 8080;
  # D29 (12/11/2026) : site servi sous /cuisine/ et /restaurants/ (préfixes conservés par le proxy jigme.fr de Lien en bio).
  # Ancien préfixe /recettes/ : 301 vers /cuisine/ (chemin et query conservés, un seul saut). Pas de 301 sur recettes.jigme.fr (pas de DNS).
  # Location toujours relatives : jamais l'hôte interne (flycast) ni le port 8080 dans une redirection.
  # Tous les 301 conservent la query ($is_args$args). Le 301 implicite de try_files (barre finale) la perdait : redirections explicites à la place.
  absolute_redirect off;
  port_in_redirect off;
  root /usr/share/nginx/html;
  # HTTPS forcé ici et non par Fly (force_https = false, voir fly.toml) : seulement les hôtes publics *.fly.dev venus en http ;
  # le flycast (Host <app>.flycast, utilisé par le proxy jigme.fr) n'est jamais redirigé.
  set $rj_https "";
  if ($http_x_forwarded_proto = "http") { set $rj_https "p"; }
  if ($host ~* "\.fly\.dev$") { set $rj_https "${rj_https}h"; }
  if ($rj_https = "ph") { return 301 https://$host$request_uri; }
  index index.html;
  gzip on; gzip_comp_level 6; gzip_min_length 1024; gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json application/xml text/xml text/plain image/svg+xml;
  include /etc/nginx/hp-active.conf;
  # /test/ (pages de bisection) : jamais servi, même si un fichier s'y trouvait
  location ^~ /test/ { return 404; }
  location ^~ /cuisine/test/ { return 404; }
  # Page 404 aux couleurs du site, avec le vrai code HTTP 404
  error_page 404 /cuisine/404.html;
  location = /cuisine/404.html { internal; add_header Cache-Control "no-cache" always; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # Racine de l'appli et préfixes sans barre finale → avec barre (une seule redirection, relative, query conservée)
  location = / { return 301 /cuisine/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location = /cuisine { return 301 /cuisine/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location = /restaurants { return 301 /restaurants/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # Ancien préfixe /recettes et /recettes/ → /cuisine/ en un seul saut (pas /recettes/ puis /cuisine/)
  location = /recettes { return 301 /cuisine/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location = /recettes/ { return 301 /cuisine/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # Ancien emplacement des restaurants sous /recettes/ ou /cuisine/ → /restaurants/<slug>/ (barre finale, un seul saut, query conservée ; pas de barre doublée)
  location ~ ^/(?:recettes|cuisine)/restaurant/?$ { return 301 /restaurants/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location ~ ^/(?:recettes|cuisine)/restaurant/(.+?)/?$ { return 301 /restaurants/$1/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # Anciennes adresses → 301 (ces deux lignes sont lues par build.mjs pour les favoris : ne pas changer leur forme)
  location ~ ^/cuisine/r/delicieuse-tarte-poires-et-chocolat-youcookcuisine/?$ { return 301 /cuisine/r/tarte-poire-chocolat/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location ~ ^/cuisine/r/pain-cuit-a-la-cocotte/?$ { return 301 /cuisine/r/pain-a-la-cocotte/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # Mêmes 301 depuis l'ancien préfixe, directement vers le nouveau slug sous /cuisine/ (un seul saut)
  location ~ ^/recettes/r/delicieuse-tarte-poires-et-chocolat-youcookcuisine/?$ { return 301 /cuisine/r/tarte-poire-chocolat/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location ~ ^/recettes/r/pain-cuit-a-la-cocotte/?$ { return 301 /cuisine/r/pain-a-la-cocotte/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # Canoniques de l'ancien préfixe en un seul saut (sinon /recettes/index.html → /cuisine/index.html → /cuisine/)
  location = /recettes/index.html { return 301 /cuisine/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location = /recettes/favoris { return 301 /cuisine/favoris/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location = /recettes/affilies { return 301 /cuisine/affilies/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location ~ ^/recettes/(r|c)/index\.html$ { return 301 /cuisine/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location ~ ^/recettes/(r|c)/?$ { return 301 /cuisine/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location ~ ^/recettes/(r|c)/([a-z0-9-]+)/index\.html$ { return 301 /cuisine/$1/$2/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location ~ ^/recettes/(favoris|affilies)/index\.html$ { return 301 /cuisine/$1/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # Catch-all : /recettes/* → /cuisine/* (reste du chemin et query conservés)
  location ~ ^/recettes/(.*)$ { return 301 /cuisine/$1$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # Barre finale explicite (query conservée) : le 301 implicite de try_files $uri $uri/ la perdait
  location = /cuisine/favoris { return 301 /cuisine/favoris/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location = /cuisine/affilies { return 301 /cuisine/affilies/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location ~ ^/cuisine/(r|c)/([a-z0-9-]+)$ { return 301 /cuisine/$1/$2/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location ~ ^/restaurants/([a-z0-9-]+)$ { return 301 /restaurants/$1/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # X-Robots-Tag : seulement si ROBOTS_NOINDEX=1 (préprod, voir fly.toml), fichier généré par start.sh
  location = /robots.txt { add_header Cache-Control "no-cache" always; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location / {
    # Doublons d'URL → adresse canonique ($request_uri = adresse demandée, y compris la query ; pas $uri, qui suivrait la redirection interne vers index.html)
    if ($request_uri ~ ^/cuisine/index\.html(?:\?|$)) { return 301 /cuisine/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
    if ($request_uri ~ ^/restaurants/index\.html(?:\?|$)) { return 301 /restaurants/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
    if ($request_uri ~ ^/cuisine/(r|c)/index\.html(?:\?|$)) { return 301 /cuisine/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
    if ($request_uri ~ ^/cuisine/(r|c)/?(?:\?|$)) { return 301 /cuisine/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
    if ($request_uri ~ ^/cuisine/(r|c)/([a-z0-9-]+)/index\.html(?:\?|$)) { return 301 /cuisine/$1/$2/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
    if ($request_uri ~ ^/restaurants/([a-z0-9-]+)/index\.html(?:\?|$)) { return 301 /restaurants/$1/$is_args$args; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
    # D48 : max-age=0 + stale-while-revalidate permet d’utiliser un prefetch (lien en bio) sans attendre la revalidation (~180–200 ms), tout en revalidant en arrière-plan. ETag conservé (304). 404 et robots restent no-cache.
    try_files $uri $uri/ =404; add_header Cache-Control "public, max-age=0, stale-while-revalidate=120" always; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # Fichiers versionnés (?v=hash) et polices : un an, immuable
  location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location /cuisine/fonts/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header Access-Control-Allow-Origin $rj_cors_polices always; add_header Vary Origin always; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  # Images : noms non versionnés (une photo peut être remplacée) → 7 jours + revalidation en arrière-plan
  location ~ "^/cuisine/img/[^/]+\.[0-9a-f]{10}\.webp$" { add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location /cuisine/img/ { add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
  location ~ ^/cuisine/(favicon\.(ico|svg)|apple-touch-icon\.png|icon-\d+\.png)$ { add_header Cache-Control "public, max-age=604800" always; include /etc/nginx/robots.inc; include /etc/nginx/security.inc; }
}
