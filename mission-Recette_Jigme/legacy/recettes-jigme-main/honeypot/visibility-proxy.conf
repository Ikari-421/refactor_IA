# Inclus seulement dans start.sh préprod quand l'API admin est disponible.
# Pas de fallback statique : une panne API ne doit pas republier les fiches masquées.
# D29 : pages publiques sous /cuisine/ ; le préfixe est retiré avant le proxy (l'API voit les chemins logiques /r/…, ses Location sont repréfixées).
# L'ancien préfixe /recettes/ est redirigé par nginx.conf (301 vers /cuisine/, un seul saut) avant d'arriver ici.
location = /cuisine/ { rewrite ^/cuisine(/.*)$ $1 break; include /opt/hp/public-proxy.inc; }
location = /cuisine/index.html { rewrite ^/cuisine(/.*)$ $1 break; include /opt/hp/public-proxy.inc; }
location = /cuisine/idx.json { rewrite ^/cuisine(/.*)$ $1 break; include /opt/hp/public-proxy.inc; }
location = /cuisine/sitemap.xml { rewrite ^/cuisine(/.*)$ $1 break; include /opt/hp/public-proxy.inc; }
location = /cuisine/r { rewrite ^/cuisine(/.*)$ $1 break; include /opt/hp/public-proxy.inc; }
location = /cuisine/c { rewrite ^/cuisine(/.*)$ $1 break; include /opt/hp/public-proxy.inc; }
# /cuisine/favoris (sans barre) : 301 dans nginx.conf (évite un location en double).
location ^~ /cuisine/r/ { rewrite ^/cuisine(/.*)$ $1 break; include /opt/hp/public-proxy.inc; }
location ^~ /cuisine/c/ { rewrite ^/cuisine(/.*)$ $1 break; include /opt/hp/public-proxy.inc; }
location ^~ /cuisine/favoris/ { rewrite ^/cuisine(/.*)$ $1 break; include /opt/hp/public-proxy.inc; }
